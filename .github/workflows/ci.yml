name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Rust tests for all crates
  rust-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Build workspace
      run: cargo build --workspace -p decon-core -p decon --verbose

    - name: Run tests
      run: cargo test --workspace -p decon-core -p decon --verbose

  # Python bindings build test
  python-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install maturin
      run: pip install maturin

    - name: Build Python wheel
      working-directory: crates/decon-py
      run: maturin build --release

    - name: Install wheel and test dependencies
      run: |
        pip install target/wheels/*.whl pytest

    - name: Test import
      run: |
        python -c "import decon; print(f'decon version: {decon.__version__}')"
        python -c "import decon; tok = decon.Tokenizer(); print(f'Tokenizer test: {tok.encode(\"hello\")}')"

    - name: Run parity tests
      working-directory: crates/decon-py
      run: pytest tests/ -v
